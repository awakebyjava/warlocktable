<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warlock Table</title>

<!-- PWA: iOS needs these specifically; it only partly honours the manifest. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warlock Table">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b0a08">

<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Warlock&nbsp;Table</h1>
  <!-- The status strip. Section 3.7 originally deferred this; it was moved
       into v1 because it is what turns "it's broken and I don't know why"
       into "the Pixelblaze lost power". -->
  <div id="strip" class="strip">
    <span class="chip" data-sys="lights">lights</span>
    <span class="chip" data-sys="audio">audio</span>
    <span class="chip" data-sys="nfc">nfc</span>
    <span class="chip" data-sys="display">display</span>
  </div>
  <div id="scene-now" class="scene-now">&nbsp;</div>
</header>

<main>
  <!-- Table Check (plan doc 5.4). First thing on the page on purpose:
       it is what you run before people arrive, not something to hunt for. -->
  <section>
    <h2>Table Check <span class="muted">before a session</span></h2>
    <div class="check-row">
      <button id="check-run">Run Check</button>
      <button id="check-full">Run + Test Lights &amp; Sound</button>
    </div>
    <div id="check-results" class="check-results"></div>
  </section>

  <section>
    <h2>Scenes</h2>
    <div id="scenes" class="grid"></div>
  </section>

  <section>
    <h2>Interruptions</h2>
    <div id="interruptions" class="grid"></div>
  </section>

  <section id="tables-section">
    <h2>Random Tables</h2>
    <div id="tables" class="grid"></div>
  </section>

  <section id="display-section">
    <h2>Table Screen</h2>
    <!-- Three explicit buttons rather than one cycling toggle: mid-session
         in low light you should be able to hit the state you want, not
         guess where a cycle will land. -->
    <div id="overlay-row" class="check-row" style="grid-template-columns:repeat(3,1fr)"></div>
    <p class="note" id="display-note"></p>
  </section>

  <section>
    <h2>Brightness</h2>
    <div class="bright-row">
      <input type="range" id="bright" min="0" max="100" value="100" step="5">
      <span id="bright-val">100%</span>
    </div>
    <p class="note">Scales within the device's power-budget ceiling. It cannot
       exceed it &mdash; see the LED reference.</p>
  </section>

  <!-- Unassigned tags: tap an unknown card on the reader and it shows up
       here ready to name. Replaces V1 printing into a terminal nobody read. -->
  <section id="unassigned-section" style="display:none">
    <h2>Unregistered Cards <span class="muted">just tapped</span></h2>
    <div id="unassigned" class="cards"></div>
  </section>

  <section>
    <h2>Cards <span class="muted" id="card-count"></span></h2>
    <div id="cards" class="cards"></div>
  </section>
</main>

<div class="idle-bar">
  <button id="idle" class="idle-btn">Return to Idle</button>
</div>

<footer>
  <span id="version" class="muted"></span>
  <span id="err" class="err"></span>
</footer>

<!-- Card editor. A dialog rather than inline, so a mis-tap during a
     session cannot silently change what a card does. -->
<div id="editor" class="modal" hidden>
  <div class="modal-box">
    <h3 id="ed-title">Edit Card</h3>
    <label>Label
      <input type="text" id="ed-label" placeholder="what the object IS, e.g. The Devil (tarot)">
    </label>
    <label>UID
      <input type="text" id="ed-uid" readonly>
    </label>
    <label>Does what
      <select id="ed-kind">
        <option value="scene">Scene &mdash; persists until replaced</option>
        <option value="interruption">Interruption &mdash; plays over, then reverts</option>
        <option value="random_table">Random Table &mdash; picks one at random</option>
      </select>
    </label>
    <label>Which one
      <!-- Options come from the controller, so an impossible target
           cannot be chosen (plan doc 4.5). -->
      <select id="ed-name"></select>
    </label>
    <p id="ed-err" class="err"></p>
    <div class="modal-actions">
      <button id="ed-cancel" class="ghost">Cancel</button>
      <button id="ed-delete" class="danger">Delete</button>
      <button id="ed-save" class="primary">Save</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
