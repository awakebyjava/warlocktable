<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Seat</title>
<meta name="theme-color" content="#0b0a08">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- A player's phone. Deliberately one job: say who you are and which
     lights are yours. Dice, whispers and break requests come later (plan
     doc 3.7); adding them now would bury the only thing that has to work
     at the start of a session. -->
<main class="player">
  <header class="join-head">
    <h1>Take a Seat</h1>
    <p class="muted" id="seat-hint">Pick the colour of the lights in front of you</p>
  </header>

  <form id="claim" autocomplete="off">
    <label class="field">
      <span>Your name</span>
      <!-- No autofocus: on iOS it throws the keyboard up over the colours,
           which are the part you are meant to be comparing to the table. -->
      <input id="pname" name="name" maxlength="24" required
             placeholder="What everyone calls you">
    </label>

    <p class="muted small">Look at the table. Which colour is lit at your place?</p>
    <div id="swatches" class="swatches"></div>

    <button id="claim-go" type="submit" disabled>Claim this seat</button>
    <p class="note" id="claim-msg">&nbsp;</p>
  </form>

  <section id="claimed" class="claimed" hidden>
    <div id="claimed-swatch" class="claimed-swatch"></div>
    <h2 id="claimed-name">&nbsp;</h2>
    <p class="muted" id="claimed-seat">&nbsp;</p>
    <button id="claim-again" class="ghost">That is not my seat</button>
</section>

<!-- Signals (plan doc 3.7). A corner of the screen, only once you have a
     seat: there is nobody to signal as until the table knows who you are.
     Deliberately unlabelled beyond the marks themselves — everyone at a
     table already knows what a raised hand means. -->
<!-- Whisper (plan doc 3.7): a conversation with the GM and nobody else.
     Its own pane rather than a strip on the seat screen, because it is the
     one thing here you actually read. -->
<section id="whisper" class="whisper" hidden>
  <div class="whisper-head">
    <span id="whisper-who" class="whisper-who">&nbsp;</span>
    <button id="whisper-close" class="ghost small">Close</button>
  </div>
  <div id="whisper-log" class="whisper-log"></div>
  <form id="whisper-form" class="whisper-form" autocomplete="off">
    <input id="whisper-text" maxlength="500" placeholder="Whisper the GM…" />
    <button id="whisper-send" type="submit">Send</button>
  </form>
</section>

<section id="signals" class="signals" hidden>
  <button id="sig-whisper" class="sig" aria-label="Whisper the GM">&#9998;</button>
  <button id="sig-question" class="sig" data-kind="question" aria-label="I have a question">?</button>
  <button id="sig-need" class="sig" data-kind="need" aria-label="I need something">!</button>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let chosen = null;
let mine = null;

function paint(zones) {
  const box = $("#swatches");
  box.innerHTML = "";
  zones.zones.filter(z => z.zone > 0).forEach(z => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch-btn" + (z.player ? " taken" : "");
    b.dataset.colour = z.colour;
    b.style.setProperty("--seat", z.colour);
    const dot = document.createElement("span");
    dot.className = "swatch-dot";
    const label = document.createElement("span");
    label.className = "swatch-label";
    // A taken seat stays visible rather than disappearing: someone whose
    // friend claimed the wrong colour needs to see that it is taken, not
    // wonder why the table has fewer seats than chairs.
    label.textContent = z.player ? z.player : z.colour;
    b.append(dot, label);
    if (z.player) {
      b.disabled = true;
    } else {
      b.addEventListener("click", () => {
        chosen = z.colour;
        [...box.children].forEach(c => c.classList.toggle(
          "chosen", c.dataset.colour === chosen));
        $("#claim-go").disabled = !$("#pname").value.trim();
      });
    }
    box.append(b);
  });
}

async function refresh() {
  try {
    const info = await (await fetch("/api/join", { cache: "no-store" })).json();
    paint(info.zones);
    if (!info.zones.supported) {
      $("#seat-hint").textContent =
        "The table cannot light seats right now — pick any free colour.";
    }
  } catch (e) {
    $("#claim-msg").textContent = "Cannot reach the table.";
  }
}

$("#pname").addEventListener("input", () => {
  $("#claim-go").disabled = !($("#pname").value.trim() && chosen);
});

$("#claim").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("#pname").value.trim();
  if (!name || !chosen) return;
  $("#claim-go").disabled = true;
  $("#claim-msg").textContent = "Claiming…";
  try {
    const res = await fetch("/api/seats/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, colour: chosen })
    });
    const data = await res.json();
    if (!res.ok) {
      // 409 is two people tapping the same colour at once, which will
      // happen every session. Repaint so they can see what is left.
      $("#claim-msg").textContent = data.error || "Could not claim that seat.";
      if (data.zones) paint(data.zones);
      chosen = null;
      return;
    }
    mine = { name: name, colour: chosen };
    localStorage.setItem("warlock-seat", JSON.stringify(mine));
    showClaimed();
  } catch (e) {
    $("#claim-msg").textContent = "Could not reach the table.";
    $("#claim-go").disabled = false;
  }
});

function showClaimed() {
  $("#claim").hidden = true;
  $("#claimed").hidden = false;
  $("#signals").hidden = false;
  $("#claimed-name").textContent = mine.name;
  $("#claimed-seat").textContent = "You are the " + mine.colour + " lights";
  $("#claimed-swatch").style.setProperty("--seat", mine.colour);
}

// Pressing the same mark again takes it back; pressing the other swaps.
// The button's own lit state IS the feedback -- there is no toast, because
// a phone held under a table at arm's length is not somewhere to read one.
let raised = null;

async function signal(kind) {
  if (!mine) return;
  try {
    const res = await fetch("/api/player/signal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ colour: mine.colour, kind: kind, name: mine.name })
    });
    if (!res.ok) return;
    raised = (raised === kind) ? null : kind;
    document.querySelectorAll(".sig").forEach(b =>
      b.classList.toggle("on", b.dataset.kind === raised));
  } catch (e) { /* the table will be there next tap */ }
}

document.querySelectorAll(".sig[data-kind]").forEach(b =>
  b.addEventListener("click", () => signal(b.dataset.kind)));

/* ---------- whisper ---------- */

let whisperSeen = 0;
let whisperTimer = null;

function renderWhisper(msgs) {
  const log = $("#whisper-log");
  if (msgs.length === whisperSeen && log.childElementCount) return;
  whisperSeen = msgs.length;
  log.innerHTML = "";
  msgs.forEach(m => {
    const row = document.createElement("div");
    row.className = "bubble " + (m.from === "gm" ? "from-gm" : "from-me");
    row.textContent = m.text;
    log.append(row);
  });
  // Newest message visible without scrolling for it.
  log.scrollTop = log.scrollHeight;
}

async function pollWhisper() {
  if (!mine || $("#whisper").hidden) return;
  try {
    const res = await fetch("/api/player/whisper?colour=" +
      encodeURIComponent(mine.colour), { cache: "no-store" });
    const data = await res.json();
    renderWhisper(data.messages || []);
  } catch (e) { /* the next tick will do */ }
}

function openWhisper() {
  if (!mine) return;
  $("#whisper").hidden = false;
  $("#whisper-who").textContent = "Whispering the GM";
  whisperSeen = -1;
  pollWhisper();
  if (!whisperTimer) whisperTimer = setInterval(pollWhisper, 3000);
}

function closeWhisper() {
  $("#whisper").hidden = true;
  if (whisperTimer) { clearInterval(whisperTimer); whisperTimer = null; }
}

$("#sig-whisper").addEventListener("click", () => {
  if ($("#whisper").hidden) openWhisper(); else closeWhisper();
});
$("#whisper-close").addEventListener("click", closeWhisper);

$("#whisper-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const box = $("#whisper-text");
  const text = box.value.trim();
  if (!text || !mine) return;
  box.value = "";
  try {
    const res = await fetch("/api/player/whisper", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ colour: mine.colour, text: text, name: mine.name })
    });
    const data = await res.json();
    if (data.messages) { whisperSeen = -1; renderWhisper(data.messages); }
  } catch (e) {
    // Put it back rather than losing what they typed.
    box.value = text;
  }
});

// The table drops a signal after 60s. Clear the lit state at the same time
// so the button never claims to be raised when the GM can no longer see it.
setInterval(() => {
  if (!raised) return;
  document.querySelectorAll(".sig").forEach(b => b.classList.remove("on"));
  raised = null;
}, 60000);

$("#claim-again").addEventListener("click", () => {
  localStorage.removeItem("warlock-seat");
  mine = null; chosen = null; raised = null;
  document.querySelectorAll(".sig").forEach(b => b.classList.remove("on"));
  $("#signals").hidden = true;
  closeWhisper();
  $("#claimed").hidden = true;
  $("#claim").hidden = false;
  $("#claim-msg").textContent = " ";
  refresh();
});

// Coming back to a page you already used should not make you re-claim: a
// phone that locked and woke should still know whose it is.
try {
  const saved = JSON.parse(localStorage.getItem("warlock-seat") || "null");
  if (saved && saved.name && saved.colour) { mine = saved; showClaimed(); }
} catch (e) { /* corrupt storage is not worth a broken page */ }

refresh();
setInterval(() => { if (!mine) refresh(); }, 4000);
</script>

</body>
</html>
