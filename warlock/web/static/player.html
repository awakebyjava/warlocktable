<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Seat</title>
<meta name="theme-color" content="#0b0a08">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png">
</head>
<body>

<!-- A player's phone (plan doc 3.7).
     ONE panel, tabbed. The first version bolted dice and whisper on as
     full-screen overlays and it was a mess: the panes covered the seat
     screen with no way back, and four floating circles in a corner is a
     stopgap rather than a design.
     Everything now lives in one column with a tab bar. The signals stay
     in the header, because `?` and `!` have to be reachable from whatever
     tab you happen to be on. -->
<main class="player">

  <!-- ---------- first run: who are you, and where ---------- -->
  <section id="join">
    <header class="join-head">
      <h1>Take a Seat</h1>
      <p class="muted" id="seat-hint">Pick the colour of the lights in front of you</p>
    </header>

    <form id="claim" autocomplete="off">
      <label class="field">
        <span>Your name</span>
        <!-- No autofocus: on iOS it throws the keyboard up over the
             colours, which are the part you are meant to be comparing to
             the table. -->
        <input id="pname" name="name" maxlength="24" required
               placeholder="What everyone calls you">
      </label>
      <p class="muted small">Look at the table. Which colour is lit at your place?</p>
      <div id="swatches" class="swatches"></div>
      <button id="claim-go" type="submit" disabled>Claim this seat</button>
      <p class="note" id="claim-msg">&nbsp;</p>
    </form>
  </section>

  <!-- ---------- everything after that ---------- -->
  <section id="app" hidden>
    <header class="app-bar">
      <span id="me-dot" class="me-dot"></span>
      <span id="me-name" class="me-name">&nbsp;</span>
      <span class="app-bar-spacer"></span>
      <button id="sig-question" class="sig" data-kind="question"
              aria-label="I have a question">?</button>
      <button id="sig-need" class="sig" data-kind="need"
              aria-label="I need something">!</button>
    </header>


    <!-- ---- dice ---- -->
    <div id="tab-dice" class="tab-panel">
      <div id="pad-display" class="pad-display">0</div>
      <!-- Same preset bar as the GM's, from the same file -- see
           dice-presets.js for why that is shared rather than copied. -->
      <div id="presets" class="presets"></div>

      <div class="pad-keys">
        <button class="key" data-d="1">1</button>
        <button class="key" data-d="2">2</button>
        <button class="key" data-d="3">3</button>
        <button class="key" data-d="4">4</button>
        <button class="key" data-d="5">5</button>
        <button class="key" data-d="6">6</button>
        <button class="key" data-d="7">7</button>
        <button class="key" data-d="8">8</button>
        <button class="key" data-d="9">9</button>
        <button id="pad-clear" class="key wide-key">Clear</button>
        <button class="key" data-d="0">0</button>
        <button id="pad-history" class="key wide-key">Log</button>
      </div>

      <!-- Lowest on the page because it is the last thing you touch and
           the easiest place for a thumb to reach. -->
      <div id="dice-shapes" class="shapes"></div>
      <div id="roll-history" class="roll-history" hidden></div>
    </div>

    <!-- ---- whisper ---- -->
    <div id="tab-whisper" class="tab-panel" hidden>
      <div id="whisper-log" class="whisper-log"></div>
      <form id="whisper-form" class="whisper-form" autocomplete="off">
        <input id="whisper-text" maxlength="500" placeholder="Whisper the GM…">
        <button id="whisper-send" type="submit">Send</button>
      </form>
    </div>

    <!-- ---- seat ---- -->
    <div id="tab-seat" class="tab-panel" hidden>
      <div id="claimed-swatch" class="claimed-swatch"></div>
      <h2 id="claimed-name">&nbsp;</h2>
      <p class="muted" id="claimed-seat">&nbsp;</p>
      <button id="claim-again" class="ghost">Leave this seat</button>
    </div>

    <!-- ---- table ----
         A PLACEHOLDER, and shipped as one deliberately. Table interaction
         is wanted and not designed; an empty fourth tab is honest about
         what is coming, and adding a tab to a finished bar later would
         re-test every width for nothing. -->
    <div id="tab-table" class="tab-panel" hidden>
      <p class="muted">Nothing here yet.</p>
      <p class="note">This is where you will reach the table itself &mdash;
         what you can see, what you can touch. It is not built.</p>
    </div>

    <!-- Same bar as the GM panel: bottom, fixed, words not symbols. One
         pattern serving both surfaces rather than two that drift. -->
    <nav class="tabbar">
      <button class="tab active" data-tab="dice">Dice</button>
      <button class="tab" data-tab="whisper">Messages</button>
      <button class="tab" data-tab="seat">Seat</button>
      <button class="tab" data-tab="table">Table</button>
    </nav>
  </section>
</main>

<script src="/dice-presets.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let chosen = null;
let mine = null;

/* ---------- claiming a seat ---------- */

function paint(zones) {
  const box = $("#swatches");
  box.innerHTML = "";
  zones.zones.filter(z => z.zone > 0).forEach(z => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch-btn" + (z.player ? " taken" : "");
    b.dataset.colour = z.colour;
    b.style.setProperty("--seat", z.colour);
    const dot = document.createElement("span");
    dot.className = "swatch-dot";
    const label = document.createElement("span");
    label.className = "swatch-label";
    // A taken seat stays visible rather than disappearing: someone whose
    // friend claimed the wrong colour needs to see that it is taken, not
    // wonder why the table has fewer seats than chairs.
    label.textContent = z.player ? z.player : z.colour;
    b.append(dot, label);
    if (z.player) {
      b.disabled = true;
    } else {
      b.addEventListener("click", () => {
        chosen = z.colour;
        [...box.children].forEach(c => c.classList.toggle(
          "chosen", c.dataset.colour === chosen));
        $("#claim-go").disabled = !$("#pname").value.trim();
      });
    }
    box.append(b);
  });
}

async function refresh() {
  try {
    const info = await (await fetch("/api/join", { cache: "no-store" })).json();
    paint(info.zones);
    if (!info.zones.supported) {
      $("#seat-hint").textContent =
        "The table cannot light seats right now — pick any free colour.";
    }
  } catch (e) {
    $("#claim-msg").textContent = "Cannot reach the table.";
  }
}

$("#pname").addEventListener("input", () => {
  $("#claim-go").disabled = !($("#pname").value.trim() && chosen);
});

$("#claim").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("#pname").value.trim();
  if (!name || !chosen) return;
  $("#claim-go").disabled = true;
  $("#claim-msg").textContent = "Claiming…";
  try {
    const res = await fetch("/api/seats/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, colour: chosen })
    });
    const data = await res.json();
    if (!res.ok) {
      // 409 is two people tapping the same colour at once, which will
      // happen every session. Repaint so they can see what is left.
      $("#claim-msg").textContent = data.error || "Could not claim that seat.";
      if (data.zones) paint(data.zones);
      chosen = null;
      return;
    }
    mine = { name: name, colour: chosen };
    localStorage.setItem("warlock-seat", JSON.stringify(mine));
    showApp();
  } catch (e) {
    $("#claim-msg").textContent = "Could not reach the table.";
    $("#claim-go").disabled = false;
  }
});

function showApp() {
  $("#join").hidden = true;
  $("#app").hidden = false;
  $("#me-name").textContent = mine.name;
  $("#me-dot").style.setProperty("--seat", mine.colour);
  $("#claimed-name").textContent = mine.name;
  $("#claimed-seat").textContent = "You are the " + mine.colour + " lights";
  $("#claimed-swatch").style.setProperty("--seat", mine.colour);
  buildShapes();
  buildPresets();
  padClear();
}

// LEAVING A SEAT HAS TO REACH THE TABLE. This used to clear localStorage
// and nothing else, so the phone forgot the seat while the table went on
// believing it was occupied: the colour stayed unavailable to everyone
// else, the seat kept its turn in initiative, and the only way out was the
// GM editing config. The player is released server-side first, and the
// local state is cleared regardless of whether that call lands -- someone
// who has walked away should not be trapped in the app by a failed
// request, and the GM can always remove the seat from their side.
$("#claim-again").addEventListener("click", async (ev) => {
  const btn = ev.currentTarget;
  btn.disabled = true;
  if (mine) {
    try {
      await fetch("/api/seats/release", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ colour: mine.colour, name: mine.name })
      });
    } catch (e) { /* leaving locally still has to work */ }
  }
  localStorage.removeItem("warlock-seat");
  mine = null; chosen = null; raised = null;
  document.querySelectorAll(".sig").forEach(b => b.classList.remove("on"));
  stopWhisperPoll();
  $("#app").hidden = true;
  $("#join").hidden = false;
  $("#claim-msg").textContent = " ";
  btn.disabled = false;
  refresh();
});

/* ---------- tabs ---------- */

function showTab(name) {
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.tab === name));
  document.querySelectorAll(".tab-panel").forEach(p =>
    p.hidden = (p.id !== "tab-" + name));
  // Only poll the conversation while it is the thing being looked at.
  if (name === "whisper") startWhisperPoll(); else stopWhisperPoll();
}

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => showTab(t.dataset.tab)));

/* ---------- signals ---------- */

// Pressing the same mark again takes it back; pressing the other swaps.
// The button's own lit state IS the feedback — a phone held under a table
// at arm's length is not somewhere to read a toast.
let raised = null;

async function signal(kind) {
  if (!mine) return;
  try {
    const res = await fetch("/api/player/signal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ colour: mine.colour, kind: kind, name: mine.name })
    });
    if (!res.ok) return;
    raised = (raised === kind) ? null : kind;
    document.querySelectorAll(".sig").forEach(b =>
      b.classList.toggle("on", b.dataset.kind === raised));
  } catch (e) { /* the table will be there next tap */ }
}

document.querySelectorAll(".sig[data-kind]").forEach(b =>
  b.addEventListener("click", () => signal(b.dataset.kind)));

// The table drops a signal after 60s. Clear the lit state at the same time,
// so the button never claims to be raised when the GM can no longer see it.
setInterval(() => {
  if (!raised) return;
  document.querySelectorAll(".sig").forEach(b => b.classList.remove("on"));
  raised = null;
}, 60000);

/* ---------- dice ---------- */

// The shapes on the pad -- see the note on GM_DICE in app.js. The
// controller permits d100 as well; the pad stays the agnostic six.
const DICE = [4, 6, 8, 10, 12, 20];
let entry = "";          // what has been typed
let holding = false;     // the display is showing a RESULT, not an entry

function padShow(t) { $("#pad-display").textContent = t; }

function padDigit(d) {
  // A result stays up until the next digit, then gets out of the way.
  if (holding) { entry = ""; holding = false; }
  if (entry.length >= 3) return;            // matches the table's 100 cap
  entry = (entry === "0" ? "" : entry) + d;
  padShow(entry || "0");
}

function padClear() { entry = ""; holding = false; padShow("0"); }

function buildPresets() {
  if (typeof buildPresetBar !== "function") return;   // file failed to load
  buildPresetBar($("#presets"), (n, d) => rollDice(d, n), "wt.preset");
}

function buildShapes() {
  const box = $("#dice-shapes");
  if (box.childElementCount) return;
  DICE.forEach(sides => {
    const b = document.createElement("button");
    b.className = "die";
    b.textContent = "d" + sides;
    b.addEventListener("click", () => rollDice(sides));
    box.append(b);
  });
}

async function rollDice(sides, presetCount) {
  if (!mine) return;
  // A preset carries its own count; a bare die tap still uses the pad.
  const count = presetCount || Math.max(1, parseInt(entry || "1", 10));
  try {
    const res = await fetch("/api/player/roll", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ colour: mine.colour, count: count,
                             sides: sides, name: mine.name })
    });
    const data = await res.json();
    if (!res.ok) { padShow(data.error ? "no" : "no"); holding = true; return; }
    padShow(String(data.total));
    holding = true;
    entry = "";
    if (!$("#roll-history").hidden) loadRollHistory();
  } catch (e) { padShow("—"); holding = true; }
}

async function loadRollHistory() {
  const box = $("#roll-history");
  try {
    const res = await fetch("/api/player/rolls?colour=" +
      encodeURIComponent(mine.colour), { cache: "no-store" });
    const data = await res.json();
    box.innerHTML = "";
    // Newest first: the roll you care about is the one you just made.
    (data.rolls || []).slice().reverse().forEach(r => {
      const row = document.createElement("div");
      row.className = "roll-row";
      row.textContent = r.label;
      box.append(row);
    });
    if (!box.childElementCount) box.textContent = "No rolls yet.";
  } catch (e) { /* leave whatever was there */ }
}

$("#pad-history").addEventListener("click", () => {
  const box = $("#roll-history");
  if (box.hidden) { loadRollHistory(); box.hidden = false; }
  else box.hidden = true;
});

document.querySelectorAll(".key[data-d]").forEach(b =>
  b.addEventListener("click", () => padDigit(b.dataset.d)));
$("#pad-clear").addEventListener("click", padClear);

/* ---------- whisper ---------- */

let whisperSeen = -1;
let whisperTimer = null;

function renderWhisper(msgs) {
  const log = $("#whisper-log");
  if (msgs.length === whisperSeen) return;
  whisperSeen = msgs.length;
  log.innerHTML = "";
  msgs.forEach(m => {
    const row = document.createElement("div");
    row.className = "bubble " + (m.from === "gm" ? "from-gm" : "from-me");
    row.textContent = m.text;
    log.append(row);
  });
  if (!msgs.length) {
    const hint = document.createElement("p");
    hint.className = "muted small";
    hint.textContent = "Only the GM sees this.";
    log.append(hint);
  }
  log.scrollTop = log.scrollHeight;
}

async function pollWhisper() {
  if (!mine) return;
  try {
    const res = await fetch("/api/player/whisper?colour=" +
      encodeURIComponent(mine.colour), { cache: "no-store" });
    renderWhisper((await res.json()).messages || []);
  } catch (e) { /* the next tick will do */ }
}

function startWhisperPoll() {
  whisperSeen = -1;
  pollWhisper();
  if (!whisperTimer) whisperTimer = setInterval(pollWhisper, 3000);
}

function stopWhisperPoll() {
  if (whisperTimer) { clearInterval(whisperTimer); whisperTimer = null; }
}

$("#whisper-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const box = $("#whisper-text");
  const text = box.value.trim();
  if (!text || !mine) return;
  box.value = "";
  try {
    const res = await fetch("/api/player/whisper", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ colour: mine.colour, text: text, name: mine.name })
    });
    const data = await res.json();
    if (data.messages) { whisperSeen = -1; renderWhisper(data.messages); }
  } catch (e) {
    box.value = text;      // put it back rather than lose what they typed
  }
});

/* ---------- start ---------- */

// Coming back to a page you already used should not make you re-claim: a
// phone that locked and woke should still know whose it is.
try {
  const saved = JSON.parse(localStorage.getItem("warlock-seat") || "null");
  if (saved && saved.name && saved.colour) { mine = saved; showApp(); }
} catch (e) { /* corrupt storage is not worth a broken page */ }

refresh();
setInterval(() => { if (!mine) refresh(); }, 4000);
</script>

</body>
</html>
